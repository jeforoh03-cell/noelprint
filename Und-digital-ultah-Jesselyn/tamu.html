<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Buat Tautan Tamu — Ulang Tahun Jesslyn</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at top,#fff,#fae9ec 65%,#eedfcd);color:#5e4241;font:16px/1.65 system-ui,sans-serif}
    main{width:min(100%,560px);padding:clamp(24px,6vw,42px);border:1px solid #dbc7a7;border-radius:26px;background:#fffaf8;box-shadow:0 22px 70px #733e501c}
    .eyebrow{margin:0;color:#984360;letter-spacing:.2em;font-size:11px;font-weight:700;text-transform:uppercase}
    h1{margin:10px 0;font:600 clamp(30px,7vw,40px)/1.15 Georgia,serif;color:#703e50}
    p{margin:12px 0 24px}
    label{display:block;font-weight:600;margin:0 0 8px}
    input{width:100%;min-width:0;padding:14px;border:1px solid #d2b7bd;border-radius:12px;background:white;color:#5e4241;font:inherit}
    input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #984360;outline-offset:3px}
    button,.button{display:inline-block;cursor:pointer;border:0;border-radius:999px;padding:13px 22px;background:#984360;color:white;text-decoration:none;font:600 15px/1.4 system-ui,sans-serif;text-align:center}
    form>button{width:100%;margin-top:16px}
    #result{margin-top:28px;border-top:1px solid #ead9d9;padding-top:22px}
    #result[hidden]{display:none}
    .recipient{padding:17px;text-align:center;border-radius:16px;background:#f7e8eb;overflow-wrap:anywhere}
    .recipient small{display:block;color:#805f66}
    .recipient strong{display:block;font:600 27px/1.3 Georgia,serif;color:#703e50;margin:6px 0}
    #inviteLink{font-size:13px;margin:8px 0 16px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .secondary{background:#efdee0;color:#703e50}
    #status{margin:12px 0 0;min-height:1.65em;font-size:14px;color:#703e50}
    .back{display:inline-block;margin-top:20px;color:#874657;text-underline-offset:4px}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Jesslyn · ONEderful Birthday</p>
    <h1>Undangan untuk tamu istimewa</h1>
    <p>Isi nama orang atau keluarga yang diundang. Nama tersebut akan tampil di cover undangan melalui tautan khusus.</p>
    <form id="guestForm">
      <label for="guestInput">Nama tamu atau keluarga</label>
      <input id="guestInput" name="nama" placeholder="Contoh: Keluarga Budi" autocomplete="off" maxlength="160" required>
      <button type="submit">Buat Tautan Undangan</button>
    </form>
    <section id="result" aria-label="Tautan undangan tamu" hidden>
      <div class="recipient"><small>Di cover undangan akan tampil:</small><span>Kepada Yth.</span><strong id="recipientName"></strong></div>
      <label for="inviteLink" style="margin-top:18px">Tautan untuk dibagikan</label>
      <input id="inviteLink" readonly>
      <div class="actions">
        <button id="copyLink" type="button">Salin Tautan</button>
        <a id="previewLink" class="button secondary" target="_blank" rel="noopener">Lihat Undangan</a>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <a class="back" href="./">Buka undangan umum</a>
  </main>
  <script>
    (function(){
      const form=document.getElementById('guestForm');
      const nameInput=document.getElementById('guestInput');
      const result=document.getElementById('result');
      const recipient=document.getElementById('recipientName');
      const linkInput=document.getElementById('inviteLink');
      const preview=document.getElementById('previewLink');
      const status=document.getElementById('status');
      function update(){
        const name=nameInput.value.trim();
        status.textContent='';
        if(!name){result.hidden=true;return false;}
        const url=new URL('./',window.location.href);
        url.searchParams.set('to',name);
        recipient.textContent=name;
        linkInput.value=url.href;
        preview.href=url.href;
        result.hidden=false;
        return true;
      }
      form.addEventListener('submit',function(e){
        e.preventDefault();
        if(!update()){nameInput.focus();return;}
        linkInput.focus();
        linkInput.select();
      });
      nameInput.addEventListener('input',function(){if(!result.hidden)update();});
      document.getElementById('copyLink').addEventListener('click',async function(){
        if(!update())return;
        try{
          await navigator.clipboard.writeText(linkInput.value);
          status.textContent='Tautan berhasil disalin. Siap dibagikan kepada tamu.';
        }catch(e){
          linkInput.focus();linkInput.select();
          status.textContent=document.execCommand('copy')?'Tautan berhasil disalin.':'Pilih dan salin tautan di atas.';
        }
      });
    })();
  </script>
</body>
</html>
